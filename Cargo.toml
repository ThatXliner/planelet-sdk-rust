[package]
name = "planelet-sdk"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for building Planelet plugin servers for SuperPlane"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
webpki-roots = "1.0.10"
rustls-webpki = "0.103.16"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
